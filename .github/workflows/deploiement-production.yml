# Déploiement MANUEL en PRODUCTION (m13menuiseries.fr). Exige l'approbation de l'environnement
# GitHub « production ». À utiliser seulement après validation du site de test.
name: Déploiement PRODUCTION (manuel, approbation requise)

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action
        type: choice
        options: [simulation, deployer, restaurer]
        default: simulation
      sauvegarde:
        description: 'Pour « restaurer » : AAAAMMJJ-HHMMSS (vide = la plus récente)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  production:
    uses: ./.github/workflows/_deployer.yml
    with:
      cible: production
      action: ${{ inputs.action }}
      sauvegarde: ${{ inputs.sauvegarde }}
    secrets: inherit
